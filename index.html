<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS - Integrated Bhumi ATR/BPN Public Services</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin="" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body, #map {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Control Panel Floating Box */
        .info-panel {
            position: absolute;
            top: 20px;
            left: 60px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 320px;
            border-left: 5px solid #0056b3;
        }

        .info-panel h3 {
            margin-bottom: 6px;
            color: #1a2a3a;
            font-size: 15px;
        }

        .info-panel p {
            font-size: 12px;
            color: #555;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .status-badge {
            display: inline-block;
            background-color: #e3f2fd;
            color: #0d47a1;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .zoom-warning {
            display: none;
            margin-top: 8px;
            background-color: #fff3cd;
            color: #856404;
            padding: 6px;
            border-radius: 4px;
            font-size: 11px;
            border: 1px solid #ffeeba;
        }
    </style>
</head>
<body>

    <!-- Panel Informasi Status Endpoint -->
    <div class="info-panel">
        <h3>Service Peta Bhumi ATR/BPN</h3>
        <p>Endpoint: <code>bhumi.atrbpn.go.id/geoserver</code></p>
        <span class="status-badge" id="zoomStatus">Tingkat Zoom: 17 (Aktif)</span>
        
        <div class="zoom-warning" id="zoomWarning">
            ⚠️ <b>Zoom Kurang Dekat:</b> Dekatkan peta hingga zoom 17+ agar layer persil dirender oleh server Bhumi.
        </div>
    </div>

    <!-- Container Peta Leaflet -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>

    <script>
        // 1. Inisialisasi Peta (Default Zoom diatur langsung ke 17 agar persil langsung muncul)
        const map = L.map('map', {
            center: [-0.3421, 111.6982], // Koordinat awal
            zoom: 17,                     // Zoom minimum agar persil pasif dirender
            maxZoom: 21
        });

        // 2. Basemap Peta Dasar
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 20,
            attribution: '© OpenStreetMap contributors'
        });

        const esriSatelit = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 20,
            attribution: '© Esri Satellite'
        });

        // Tampilkan Satelit sebagai peta dasar awal
        esriSatelit.addTo(map);

        // 3. Panggilan Endpoint Publik GeoServer Bhumi ATR/BPN via Proxy CORS
        const bhumiEndpoint = 'https://bhumi.atrbpn.go.id/geoserver/ows';
        const bhumiProxiedUrl = 'https://corsproxy.io/?' + encodeURIComponent(bhumiEndpoint);

        // Layer WMS Persil Pasif
        const persilPasifWMS = L.tileLayer.wms(bhumiProxiedUrl, {
            layers: 'atrbpn:persilpasif',
            format: 'image/png',
            transparent: true,
            version: '1.3.0',
            maxZoom: 21,
            tileSize: 512,
            zoomOffset: -1,
            attribution: '© Kementerian ATR/BPN (Portal Bhumi)'
        });

        // Layer WMS Peta Bidang Tanah (PBT) - Endpoint Tambahan Bhumi
        const pbtWMS = L.tileLayer.wms(bhumiProxiedUrl, {
            layers: 'atrbpn:Peta_Bidang_Tanah',
            format: 'image/png',
            transparent: true,
            version: '1.3.0',
            maxZoom: 21,
            tileSize: 512,
            zoomOffset: -1,
            attribution: '© Kementerian ATR/BPN (Portal Bhumi)'
        });

        // Tampilkan layer persil pasif secara default
        persilPasifWMS.addTo(map);

        // 4. Layer Control (Switch Basemap & Layer WMS)
        const baseMaps = {
            "Esri Satelit": esriSatelit,
            "OpenStreetMap": osm
        };

        const overlayMaps = {
            "Persil Pasif ATR/BPN": persilPasifWMS,
            "Peta Bidang Tanah (PBT)": pbtWMS
        };

        L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

        // 5. Monitoring Zoom Level untuk memberi edukasi pembatasan skala (Scale Limit Bhumi)
        const zoomStatus = document.getElementById('zoomStatus');
        const zoomWarning = document.getElementById('zoomWarning');

        map.on('zoomend', function() {
            const currentZoom = map.getZoom();
            zoomStatus.innerText = `Tingkat Zoom: ${currentZoom}`;

            if (currentZoom < 17) {
                zoomWarning.style.display = 'block';
                zoomStatus.style.backgroundColor = '#f8d7da';
                zoomStatus.style.color = '#721c24';
            } else {
                zoomWarning.style.display = 'none';
                zoomStatus.style.backgroundColor = '#e3f2fd';
                zoomStatus.style.color = '#0d47a1';
            }
        });
    </script>
</body>
</html>
